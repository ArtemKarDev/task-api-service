services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?задайте DB_NAME в env-файле}
      POSTGRES_USER: ${DB_USER:?задайте DB_USER в env-файле}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в env-файле}
    ports:
      - "127.0.0.1:${DB_PORT:?задайте DB_PORT в env-файле}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: task-api-service:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REQUEST_LOG_LEVEL: DEBUG
    ports:
      - "127.0.0.1:${APP_PORT:?задайте APP_PORT в env-файле}:8080"
    networks:
      default:
        aliases:
          - task-app
volumes:
  postgres_data: