<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="taskForm(action, label)" th:action="${action}" th:object="${taskForm}"
      method="post" class="panel" novalidate data-testid="task-form">

    <div class="field">
        <label for="title">Название</label>
        <input type="text" id="title" th:field="*{title}" data-testid="title-input">
        <div class="err" th:if="${#fields.hasErrors('title')}" th:errors="*{title}" data-testid="title-error"></div>
    </div>

    <div class="field">
        <label for="description">Описание</label>
        <textarea id="description" th:field="*{description}" data-testid="description-input"></textarea>
        <div class="err" th:if="${#fields.hasErrors('description')}" th:errors="*{description}" data-testid="description-error"></div>
    </div>

    <div class="field">
        <label for="assignee">Исполнитель</label>
        <input type="text" id="assignee" th:field="*{assignee}" data-testid="assignee-input">
        <div class="err" th:if="${#fields.hasErrors('assignee')}" th:errors="*{assignee}" data-testid="assignee-error"></div>
    </div>

    <div class="row">
        <div class="field">
            <label for="priority">Приоритет</label>
            <select id="priority" th:field="*{priority}" data-testid="priority-select">
                <option value="">Выберите приоритет</option>
                <option th:each="p : ${priority}" th:value="${p}" th:text="${p}"></option>
            </select>
            <div class="err" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}" data-testid="priority-error"></div>
        </div>
        <div class="field">
            <label for="status">Статус</label>
            <select id="status" th:field="*{status}" data-testid="status-select">
                <option value="">Выберите статус</option>
                <option th:each="s : ${status}" th:value="${s}" th:text="${s}"></option>
            </select>
            <div class="err" th:if="${#fields.hasErrors('status')}" th:errors="*{status}" data-testid="status-error"></div>
        </div>
    </div>

    <div class="actions">
        <button type="submit" class="btn" th:text="${label}" data-testid="submit-btn">Сохранить</button>
        <a class="btn ghost" th:href="@{/tasks}" data-testid="cancel-btn">Вернуться к списку</a>
    </div>
</form>
</body>
</html>
