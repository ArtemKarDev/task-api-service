<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Смена пароля')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('profile')}"></header>
<main>
    <h1>Смена пароля</h1>
    <p class="lead">Введите текущий пароль и придумайте новый (от 8 символов).</p>

    <form class="panel" style="max-width:420px" method="post" th:action="@{/profile/password}"
          th:object="${passwordForm}" novalidate data-testid="password-form">
        <div class="field">
            <label for="currentPassword">Текущий пароль</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}" autocomplete="current-password"
                   data-testid="current-password-input">
            <div class="err" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"
                 data-testid="current-password-error"></div>
        </div>
        <div class="field">
            <label for="newPassword">Новый пароль</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password"
                   data-testid="new-password-input">
            <div class="err" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"
                 data-testid="new-password-error"></div>
        </div>
        <div class="field">
            <label for="confirmPassword">Повторите новый пароль</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password"
                   data-testid="confirm-password-input">
            <div class="err" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
                 data-testid="confirm-password-error"></div>
        </div>
        <div class="actions">
            <button type="submit" class="btn" data-testid="password-submit">Сменить пароль</button>
            <a class="btn ghost" th:href="@{/tasks}" data-testid="cancel-btn">Отмена</a>
        </div>
    </form>
</main>
</body>
</html>
