<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('login')}"></header>
<main>
    <h1>Вход</h1>
    <p class="lead">Введите логин и пароль.</p>

    <div class="flash" th:if="${param.logout}" role="status" data-testid="login-logout">Вы вышли из системы.</div>
    <div class="err" th:if="${param.error}" role="alert" data-testid="login-error">Неверный логин или пароль.</div>

    <form class="panel" style="max-width:420px" method="post" th:action="@{/login}" novalidate data-testid="login-form">
        <div class="field"><label for="username">Логин</label>
            <input id="username" name="username" autocomplete="username" data-testid="login-username"></div>
        <div class="field"><label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password" data-testid="login-password"></div>
        <button class="btn" type="submit" data-testid="login-submit">Войти</button>
    </form>
</main>
</body>
</html>
