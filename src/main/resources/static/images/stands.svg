<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Стенды и CI</title>
  <desc id="d">Коммит запускает Jenkins: автодеплой на dev и smoke-тесты, ночной регресс на stage, деплой и откат на prod по тегу образа.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3451e6"/>
    </marker>
  </defs>

  <!-- зоны -->
  <rect x="300" y="20" width="310" height="200" rx="12" fill="#f4f6fb" stroke="#d5dbe8"/>
  <text x="455" y="42" text-anchor="middle" font-size="12" fill="#5b6476">рабочий компьютер · Docker</text>
  <rect x="625" y="20" width="160" height="200" rx="12" fill="#f4f6fb" stroke="#d5dbe8"/>
  <text x="705" y="42" text-anchor="middle" font-size="12" fill="#5b6476">VPS · Ubuntu</text>

  <!-- стрелки -->
  <g fill="none" stroke="#3451e6" stroke-width="2" marker-end="url(#a)">
    <path d="M130,120 H156"/>
    <path d="M280,120 H316"/>
    <path d="M450,120 H466"/>
    <path d="M600,120 H636"/>
  </g>

  <!-- блоки -->
  <g stroke-width="1.5">
    <rect x="20" y="85" width="110" height="70" rx="10" fill="#fff" stroke="#c3cbdc"/>
    <rect x="160" y="85" width="120" height="70" rx="10" fill="#1b2335" stroke="#1b2335"/>
    <rect x="320" y="60" width="130" height="140" rx="10" fill="#fff" stroke="#3451e6"/>
    <rect x="470" y="60" width="130" height="140" rx="10" fill="#fff" stroke="#3451e6"/>
    <rect x="640" y="60" width="130" height="140" rx="10" fill="#3451e6" stroke="#3451e6"/>
  </g>

  <g text-anchor="middle">
    <text x="75" y="116" font-size="15" font-weight="600" fill="#1b2335">git push</text>
    <text x="75" y="136" font-size="12" fill="#5b6476">main</text>

    <text x="220" y="116" font-size="15" font-weight="600" fill="#fff">Jenkins</text>
    <text x="220" y="136" font-size="12" fill="#b9c3d8">Pipeline</text>

    <text x="385" y="90" font-size="17" font-weight="600" fill="#1b2335">dev</text>
    <text x="385" y="118" font-size="12" fill="#1b2335">автодеплой</text>
    <text x="385" y="136" font-size="12" fill="#1b2335">при коммите</text>
    <text x="385" y="162" font-size="12" fill="#5b6476">smoke-тесты</text>

    <text x="535" y="90" font-size="17" font-weight="600" fill="#1b2335">stage</text>
    <text x="535" y="118" font-size="12" fill="#1b2335">полный</text>
    <text x="535" y="136" font-size="12" fill="#1b2335">регресс</text>
    <text x="535" y="162" font-size="12" fill="#5b6476">каждую ночь</text>

    <text x="705" y="90" font-size="17" font-weight="600" fill="#fff">prod</text>
    <text x="705" y="118" font-size="12" fill="#fff">деплой по SSH</text>
    <text x="705" y="136" font-size="12" fill="#fff">откат по тегу</text>
    <text x="705" y="162" font-size="12" fill="#dfe5ff">HTTPS · Caddy</text>
    <text x="705" y="180" font-size="12" fill="#dfe5ff">этот сайт</text>
  </g>

  <!-- итоги прогонов -->
  <g font-size="12" fill="#5b6476" text-anchor="middle">
    <path d="M220,155 V255 H535 V200" fill="none" stroke="#7a849a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M385,200 V255" fill="none" stroke="#7a849a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="270" y="243" width="220" height="24" rx="12" fill="#fff" stroke="#d5dbe8"/>
    <text x="380" y="259">Allure-отчёт · сводка в Telegram</text>
  </g>
</svg>
