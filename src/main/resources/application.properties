spring.application.name=task-api-service

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/taskdb
spring.datasource.username=taskuser
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Verbose HTTP request logging. Default INFO (quieter when started from the IDE); compose.yaml sets DEBUG on the stands
logging.level.org.springframework.web.servlet.DispatcherServlet=${REQUEST_LOG_LEVEL:INFO}
# Log of REST requests and responses. Switched on in compose.yaml on the stands
app.http-log.enabled=${HTTP_LOG_ENABLED:true}
# Unknown fields in a JSON request are rejected (400) instead of being silently ignored
spring.jackson.deserialization.fail-on-unknown-properties=true

# Kafka. Default points to the local stand broker; containers override it with SPRING_KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=task-api-service
# A new consumer group starts from the beginning of the topic, so commands sent before the first start are not lost
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic-in=task_in
app.kafka.topic-in-dlq=task_in_dlq
app.kafka.topic-out=task_out
# If the broker is unreachable, sending blocks for at most 3 seconds, then the event is logged as lost
spring.kafka.producer.properties.max.block.ms=3000

app.security.user.username=user
app.security.admin.username=admin

app.security.jwt.ttl-minutes=15