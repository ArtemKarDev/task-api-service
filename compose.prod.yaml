# Надстройка для стенда prod (сервер 1 CPU, 2 ГБ RAM).
# Запуск: docker compose -f compose.yaml -f compose.prod.yaml --env-file <env-prod> up -d --no-build
services:
  postgres:
    mem_limit: 256m

  kafka:
    mem_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m"
    healthcheck:
      # На 1 CPU штатная проверка (отдельная JVM) не укладывается в таймаут.
      # Проверяем, что брокер принимает соединения на внутреннем порту.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/29092"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  app:
    mem_limit: 768m
    healthcheck:
      start_period: 240s
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      REQUEST_LOG_LEVEL: INFO
      HTTP_LOG_ENABLED: "false"
      SERVER_FORWARDHEADERSSTRATEGY: framework

  kafka-ui:
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - app
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?задайте PUBLIC_DOMAIN в env-файле}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: